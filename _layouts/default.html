<!DOCTYPE html>
<html lang="en">

{% if page.layout == "home" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "mainEntity": {
    "@type": "Person",
    "name": "Emiliano Sandri",
    "url": "https://emiliano-sandri.github.io/",
    "description": "Economics PhD student at University College London working on decision theory and information theory.",
    "image": "https://emiliano-sandri.github.io/images/profile.jpg",
    "jobTitle": "Economics PhD Student",
    "affiliation": {
      "@type": "Organization",
      "name": "University College London"
    }
  }
}
</script>
{% endif %}

<body class='page {{layout.bodyClass}}'>
  {% include main-menu-mobile.html %}
  <div id="wrapper" class="wrapper">
    {% include header.html headerClass='header-extra' %}
    {{content}}
  </div>
  {% include sub-footer.html %}
  <script type="text/javascript" src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
  {% include google-analytics.html %}
</body>
</html>
